# : Manager [[[

[mgr]
cwd = { fg = "#e4e1e9" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff72be", bg = "#ff72be" }
marker_cut      = { fg = "#ffd8ed", bg = "#ffd8ed" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#e8b9d4", bg = "#e8b9d4" }

# Count
count_copied   = { fg = "#2e1125", bg = "#ffd8ed" }
count_cut      = { fg = "#2e1125", bg = "#ffd8ed" }
count_selected = { fg = "#282b60", bg = "#e8b9d4" }

# Border
border_symbol = "│"
border_style  = { fg = "#bfc1ff" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#bfc1ff", bold = true, bg = "#131318" }
inactive  = { fg = "#c5c4dd", bg = "#131318" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#bfc1ff", fg = "#282b60", bold = true }
normal_alt  = { bg = "#46464f", fg = "#c7c5d0" }

# Select mode
select_main = { bg = "#c5c4dd", fg = "#2e2f42", bold = true }
select_alt  = { bg = "#46464f", fg = "#c7c5d0" }

# Unset mode
unset_main = { bg = "#e8b9d4", fg = "#46263b", bold = true }
unset_alt  = { bg = "#46464f", fg = "#c7c5d0" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#6663a5" }
perm_write = { fg = "#c2468d" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#ff3fa6" }
perm_sep   = { fg = "#4d47ff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#bfc1ff", bg = "#39383f" }
progress_error  = { fg = "#ffb4ab", bg = "#39383f" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#39383f" }
cand = { fg = "#bfc1ff" }
rest = { fg = "#282b60" }
desc = { fg = "#e4e1e9" }
separator = " ▶ "
separator_style = { fg = "#e4e1e9" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#e8b9d4" }
title_warn  = { fg = "#bfc1ff" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#bfc1ff" }
active = { fg = "#e8b9d4", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#bfc1ff" }
value  = { fg = "#e4e1e9" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#bfc1ff", bg = "#282b60" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#bfc1ff" }
title   = {}
hovered = { fg = "#ffd8ed", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e4e1e9" }
run    = { fg = "#e4e1e9" }
footer = { fg = "#2e2f42", bg = "#c5c4dd" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e4e1e9" },
    { url = "*/", fg = "#bfc1ff" },
]

# : ]]]
