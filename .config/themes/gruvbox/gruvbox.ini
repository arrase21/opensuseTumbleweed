shell=fish

[main]
font=VictorMono Nerd Font :size=11:weight=bold

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[colors-dark]
alpha=0.96
foreground=d4be98
background=282828

selection-foreground=ebdbb2
selection-background=d65d0e

regular0=3c3836
regular1=ea6962
regular2=a9b665
regular3=d8a657
regular4=7daea3
regular5=d3869b
regular6=89b482
regular7=d4be98

