# Track Info
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock-music.sh --title)"
    color = $text_color
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono Heavy
    position = -20, 120
    halign =right 
    valign = bottom
    zindex = 2
}

