label {
    monitor =
    text = cmd[update:1000] echo "󰠃  $(~/.config/hypr/hyprlock-music.sh --artist)"
    color = $text_color
    font_size = 8
    font_family = JetBrainsMono Nerd Font Mono Semibold
    position = -110, 95
    halign =right 
    valign = bottom
    zindex = 2
}

# Controls
label {
    monitor =
    text = 󰒮
    color = $text_color
    font_size = 12
    onclick = playerctl previous
    position = -150, 35
    halign =right
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock-music.sh --status
    color = $text_color
    font_size = 10
    onclick = playerctl play-pause
    position = -120, 35
    halign =right 
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = 󰒭
    color = $text_color
    font_size = 12
    onclick = playerctl next
    position = -90, 35
    halign =right 
    valign = bottom
    zindex = 2
}

# Progress
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock-music.sh --position)"
    color = $text_color
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = -220, 65
    halign =right 
    valign = bottom
    zindex = 2
}

label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock-music.sh --length)"
    color = $text_color
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = -20, 65
    halign =right 
    valign = bottom
    zindex = 2
}

label {
    monitor = 
    text = cmd[update:1000] ~/.config/hypr/hyprlock-music.sh --progress-bar
    color = $primary
    font_size = 9
    font_family = JetBrainsMono Nerd Font Mono
    position = -80, 65
    halign =right 
    valign = bottom
    zindex = 2
}

