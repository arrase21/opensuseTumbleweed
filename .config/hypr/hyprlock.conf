# Colors
source = $HOME/.config/hypr/hyprlock-colors.conf
# Background
background {
    monitor =
    path = $background_image
    color = $background
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.1
}
# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}
# ----------------------------------------------------------------------------
# User Profile
# ----------------------------------------------------------------------------
image {
    monitor =
    path =$square_image
    size = 60
    border_size = 2
    rounding = -1
    rotate = 0
    reload_time = -1
    position = -90, 40
    halign = center 
    valign = center
}

# ----------------------------------------------------------------------------
# Password Input Field
# ----------------------------------------------------------------------------
input-field {
    monitor =
    size = 250, 40
    border_size = 0
    rounding = 2
    outline_thickness = 2
    dots_size = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = false

    outer_color = $primary
    inner_color = rgba(0, 0, 0, 1.0)
    font_color = $text_color
    check_color = $primary
    fail_color = rgb(204, 36, 29)

    placeholder_text = 
    fade_on_empty = false
    font_family = SF Pro Display Bold, Symbols Nerd Font Bold
    hide_input = false
    position = 100, 40
    halign =center
    valign = center
}
label {
    monitor =
    text = <span foreground="##ffffff99">󰌾  </span>
    position = -7, 40 
    font_size = 14
    font_family = Symbols Nerd Font Bold
    halign = center
    valign = center
}

# ----------------------------------------------------------------------------
# Clock & Date
# ----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M:%p")</span>"
    color = rgba(216, 222, 233, .75)
    font_size = 62
    font_family = SF Pro Display 
    position = 50, 160
    halign =center 
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d %Y")"
    color = rgba(216, 222, 233, .75)
    font_size = 15
    font_family = SF Pro Display
    position = 50, 105
    halign = center
    valign = center
}

