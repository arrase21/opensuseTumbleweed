# Colors
source = $HOME/.config/hypr/hyprlock-colors.conf
# Background
background {
    monitor =
    path = $background_image
    color = $background
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.1
}
# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}
# ----------------------------------------------------------------------------
# User Profile
# ----------------------------------------------------------------------------
image {
    monitor =
    path = $background_image
    border_size = 2
    border_color = $primary
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 50, 40
    halign =left 
    valign = center
}
# ----------------------------------------------------------------------------
# Clock & Date
# ----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $primary
    font_size = 25
    font_family = SF Pro Display Bold, Symbols Nerd Font Bold
    position = 40, 350
    halign =left 
    valign = center
}
# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $primary
    font_size = 120
    font_family = SF Pro Display Bold, Symbols Nerd Font Bold
    position = 0, 250
    halign =left 
    valign = center
}
# User
label {
    monitor =
    text =     $USER
    color = $text_color
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 18
    font_family = SF Pro Display Bold, Symbols Nerd Font Bold
    position = 100, -130
    halign =left 
    valign = center
}

# User-Box
shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = $outline
    rotate = 0
    xray =  # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 10, -130
    halign =left 
    valign = center
}

# ----------------------------------------------------------------------------
# Password Input Field
# ----------------------------------------------------------------------------
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true

    outer_color = $primary
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $text_color
    check_color = $primary
    fail_color = rgb(204, 36, 29)

    fade_on_empty = false
    font_family = SF Pro Display Bold, Symbols Nerd Font Bold
    placeholder_text = <span foreground="##ffffff99">󰌾  Enter Pass</span>
    hide_input = false
    position = 10, -210
    halign =left 
    valign = center
}

