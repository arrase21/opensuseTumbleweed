# ============================================================================
# Music Player Widget
# ============================================================================

# Album Art
image {
    monitor =
    path = $HOME/.config/hypr/music.webp
    size = 100
    rounding = 5
    border_size = 0
    border_color = $primary
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/hyprlock-music.sh --art
    position = -400, 57
    halign = right
    valign = bottom
    zindex = 2
}

# Player Background Box
shape {
    monitor =
    color = $entry_background_color
    size = 500, 140
    rounding = 10
    border_size = 2
    border_color = $primary
    position = 0, 40
    halign =right 
    valign = bottom
    zindex = 1
}

# Track Info
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock-music.sh --title)"
    color = $text_color
    font_size = 14
    font_family = JetBrainsMono Nerd Font Mono Heavy
    position = -55, 138
    halign =right 
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock-music.sh --player)"
    color = $text_color
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono Bold
    position = -20, 45
    halign =right 
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "󰠃  $(~/.config/hypr/hyprlock-music.sh --artist)"
    color = $text_color
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono Semibold
    position = -110, 118
    halign =right 
    valign = bottom
    zindex = 2
}

# Controls
label {
    monitor =
    text = 󰒮
    color = $text_color
    font_size = 25
    onclick = playerctl previous
    position = -305, 55
    halign =right
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock-music.sh --status
    color = $text_color
    font_size = 25
    onclick = playerctl play-pause
    position = -200, 55
    halign =right 
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = 󰒭
    color = $text_color
    font_size = 25
    onclick = playerctl next
    position = -90, 55
    halign =right 
    valign = bottom
    zindex = 2
}

# Progress
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock-music.sh --position)"
    color = $text_color
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = -320, 95
    halign =right 
    valign = bottom
    zindex = 2
}

label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock-music.sh --length)"
    color = $text_color
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = -50, 95
    halign =right 
    valign = bottom
    zindex = 2
}

label {
    monitor = 
    text = cmd[update:1000] ~/.config/hypr/hyprlock-music.sh --progress-bar
    color = $primary
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -120, 95
    halign =right 
    valign = bottom
    zindex = 2
}

